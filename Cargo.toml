[package]
name = "auditorium"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/someotherself/auditorium"
description = "High-level audio library for playback and capture"
categories = ["multimedia::audio", "multimedia"]

[dependencies]
crossbeam-channel = "0.5.16"
maudio = { version = "0.1.9", path = "../maudio/crates/maudio", features = [ "external-lib" ] }
symphonia = { version = "0.6.0", features = ["all"] }

[build-dependencies]
maudio = { version = "0.1.9", path = "../maudio/crates/maudio", features = ["external-lib"] }